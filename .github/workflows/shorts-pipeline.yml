name: TrendForge Shorts Pipeline

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendforge-main-pipeline
  cancel-in-progress: false

jobs:
  produce-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q subtitles

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests and credential-free checks
        run: |
          pytest -q
          python -m trendforge.pipeline --self-test

      - name: Discover trends, create a Short, and publish when enabled
        id: pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
          MAX_UPLOADS_PER_DAY: ${{ vars.MAX_UPLOADS_PER_DAY || '2' }}
          MIN_TREND_SCORE: ${{ vars.MIN_TREND_SCORE || '42' }}
          MAX_CANDIDATES: ${{ vars.MAX_CANDIDATES || '35' }}
          MAX_SEARCHES_PER_RUN: ${{ vars.MAX_SEARCHES_PER_RUN || '4' }}
          HISTORY_RETENTION_DAYS: ${{ vars.HISTORY_RETENTION_DAYS || '45' }}
          MIN_SCRIPT_QUALITY: ${{ vars.MIN_SCRIPT_QUALITY || '70' }}
          YOUTUBE_REGIONS: ${{ vars.YOUTUBE_REGIONS || 'US|GB|CA|AU' }}
          YOUTUBE_SEARCH_QUERIES: ${{ vars.YOUTUBE_SEARCH_QUERIES || 'MrBeast|Mark Rober|Ryan Trahan|Sidemen|Airrack|Mrwhosetheboss|Marques Brownlee|creator economy|YouTube challenge|AI creators|gaming creator|business creator' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts' }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE || 'coral' }}
          VIDEO_CATEGORY_ID: ${{ vars.VIDEO_CATEGORY_ID || '24' }}
          VIDEO_PRIVACY_STATUS: ${{ vars.VIDEO_PRIVACY_STATUS || 'public' }}
        run: python -m trendforge.pipeline

      - name: Persist trend history (no credentials committed)
        if: always() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update TrendForge trend history [skip ci]"
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:main"
          else
            echo "No state changes to commit."
          fi

      - name: Upload rendered Short and run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-run-${{ github.run_number }}
          path: |
            outputs/*.mp4
            outputs/run-summary.md
          if-no-files-found: ignore
          retention-days: 3
