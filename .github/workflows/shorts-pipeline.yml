name: TrendForge Original-Graphics Preview (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests and create preview-only original graphics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTO_PUBLISH: "false"
          MAX_CANDIDATES: "20"
        run: |
          pytest -q
          python -m trendforge.pipeline --self-test
          python -m trendforge.pipeline
      - name: Save original-graphics preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-original-graphics-preview-${{ github.run_number }}
          path: |
            outputs/*.mp4
            outputs/run-summary.md
          if-no-files-found: ignore
          retention-days: 3
