name: TrendForge Clip Builder (no upload)

# Compute only: discovery (~10-20 quota units) + clipping, every 2 hours.
# Finished clips are queued as a GitHub prerelease "clips-<source_id>".
# Assets: part-NN.mp4 + manifest.json + metadata.json. This workflow never uploads to YouTube.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # create queue prereleases

concurrency:
  group: trendforge-clip-builder
  cancel-in-progress: false

jobs:
  build-clips:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check queue (skip everything if full)
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease and (.tagName|startswith("clips-")))] | length')
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "Unpublished series queued: $n"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 1)
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore discovery state (uploads-playlist cache, cursors)
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 1)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/quota_ledger.json
          key: trendforge-state-${{ github.run_id }}
          restore-keys: trendforge-state-

      - name: Install dependencies
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements-clipper.txt "yt-dlp[default]" --pre -U bgutil-ytdlp-pot-provider
          # PO-token provider (helps yt-dlp on datacenter IPs); best-effort.
          docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
          sleep 5

      - name: Discover, clip, and queue as prerelease
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QUEUE_MAX_SERIES: ${{ vars.QUEUE_MAX_SERIES || '1' }}
          SERIES_PARTS: ${{ vars.SERIES_PARTS || '5' }}
          PART_SECONDS: ${{ vars.PART_SECONDS || '55' }}
          YOUTUBE_REGIONS: ${{ vars.YOUTUBE_REGIONS || 'US|GB|CA|AU' }}
          YOUTUBE_CREATOR_HANDLES: ${{ vars.YOUTUBE_CREATOR_HANDLES || 'MrBeast|MarkRober|RyanTrahan|Sidemen|Airrack|Mrwhosetheboss|MKBHD' }}
        run: bash scripts/ci_build.sh

      - name: Save discovery state
        if: always() && steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 1)
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/quota_ledger.json
          key: trendforge-state-${{ github.run_id }}
