name: TrendForge Original Shorts Builder (no upload)

# Compute only: discovery (~10-20 quota units) + original motion-graphics Short with local TTS, every 2 hours.
# No YouTube downloads.
# Each Short is queued as a GitHub prerelease "clips-<source_id>" (short.mp4 + metadata.json).
# Assets: part-NN.mp4 + manifest.json + metadata.json. This workflow never uploads to YouTube.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # create queue prereleases

concurrency:
  group: trendforge-clip-builder
  cancel-in-progress: false

jobs:
  build-clips:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check queue (skip everything if full)
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease and (.tagName|startswith("clips-")))] | length')
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "Unpublished series queued: $n"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 3)
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore discovery state (uploads-playlist cache, cursors)
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 3)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/quota_ledger.json
          key: trendforge-state-${{ github.run_id }}
          restore-keys: trendforge-state-

      - name: Cache Piper voice
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 3)
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voice-en_US-lessac-medium

      - name: Install dependencies
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          pip install -r requirements.txt

      - name: Build original Short and queue as prerelease
        if: steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 3)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTO_PUBLISH: "false"
          MIN_SOURCE_SECONDS: "60"
          QUEUE_MAX_SERIES: ${{ vars.QUEUE_MAX_SERIES || '3' }}
          YOUTUBE_REGIONS: ${{ vars.YOUTUBE_REGIONS || 'US|GB|CA|AU' }}
          YOUTUBE_CREATOR_HANDLES: ${{ vars.YOUTUBE_CREATOR_HANDLES || 'MrBeast|MarkRober|Sidemen|Airrack|Mrwhosetheboss|MKBHD' }}
        run: bash scripts/ci_original.sh

      - name: Save discovery state
        if: always() && steps.queue.outputs.pending < (vars.QUEUE_MAX_SERIES || 3)
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/quota_ledger.json
          key: trendforge-state-${{ github.run_id }}
