name: TrendForge Autonomous Shorts

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours UTC
  workflow_dispatch:
    inputs:
      publish:
        description: Upload generated Shorts to YouTube (requires OAuth secrets)
        required: false
        type: boolean
        default: false
      count:
        description: Number of series parts
        required: false
        type: choice
        options: ["3", "5", "10"]
        default: "5"
      part_seconds:
        description: Seconds per part
        required: false
        type: choice
        options: ["30", "45", "55"]
        default: "55"

permissions:
  contents: read

concurrency:
  group: trendforge-autonomous-shorts
  cancel-in-progress: false

jobs:
  autonomous-shorts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate autonomous rights and publishing credentials
        env:
          PUBLISH: ${{ inputs.publish }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "::notice::Autonomous mode: fetching trending YouTube videos and clipping authorized source footage."
          echo "::notice::The operator is responsible for verifying reuse rights for any footage processed."
          if [ "$PUBLISH" = "true" ]; then
            missing=""
            [ -n "$YOUTUBE_CLIENT_ID" ] || missing="$missing YOUTUBE_CLIENT_ID"
            [ -n "$YOUTUBE_CLIENT_SECRET" ] || missing="$missing YOUTUBE_CLIENT_SECRET"
            [ -n "$YOUTUBE_REFRESH_TOKEN" ] || missing="$missing YOUTUBE_REFRESH_TOKEN"
            if [ -n "$missing" ]; then
              echo "::error::Publishing requested but OAuth secrets are missing:$missing"
              exit 1
            fi
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg, yt-dlp, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements-clipper.txt yt-dlp pytest

      - name: Run clipper unit tests
        run: pytest -q tests/test_clipper.py

      - name: Discover trending YouTube candidates
        id: discover
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p outputs
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY not set; falling back to demo source video."
            echo "source_url=https://www.youtube.com/watch?v=jNQXAC9IVRw" >> $GITHUB_OUTPUT
            echo "source_title=Me at the zoo" >> $GITHUB_OUTPUT
            echo "source_creator=Jawed Karim" >> $GITHUB_OUTPUT
            exit 0
          fi
          python -m trendforge.discover --count "${{ inputs.count }}" --json > outputs/discovery.json
          python - <<'PY'
          import json, os
          with open("outputs/discovery.json") as f:
              cands = json.load(f)
          if not cands:
              raise SystemExit("No trending candidates found")
          top = cands[0]
          print(f"Selected: {top['video_id']} — {top['title']} by {top['creator']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"source_url={top['url']}\n")
              out.write(f"source_title={top['title']}\n")
              out.write(f"source_creator={top['creator']}\n")
          PY

      - name: Download source video via yt-dlp
        env:
          SOURCE_URL: ${{ steps.discover.outputs.source_url }}
        run: |
          mkdir -p outputs/source
          yt-dlp \
            --no-check-certificates \
            --no-warnings \
            --quiet \
            --no-playlist \
            --format "best[height<=720][ext=mp4]/best" \
            --extractor-args "youtube:player_client=android" \
            --output "outputs/source/source-video.%(ext)s" \
            "$SOURCE_URL"
          ls -la outputs/source/

      - name: Build Shorts series (connected parts, fast PART overlay)
        env:
          SOURCE_VIDEO_URL: ${{ steps.discover.outputs.source_url }}
          SOURCE_VIDEO_TITLE: ${{ steps.discover.outputs.source_title }}
          SOURCE_VIDEO_CREATOR: ${{ steps.discover.outputs.source_creator }}
        run: |
          python -m trendforge.series \
            --input outputs/source/source-video.mp4 \
            --output-dir outputs/series \
            --source-url "$SOURCE_VIDEO_URL" \
            --title "$SOURCE_VIDEO_TITLE" \
            --creator "$SOURCE_VIDEO_CREATOR" \
            --rights-confirmed \
            --count ${{ inputs.count }} \
            --part-seconds ${{ inputs.part_seconds }} \
            --overlay-seconds 2

      - name: Publish Shorts to YouTube
        if: ${{ inputs.publish == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PRIVACY_STATUS: ${{ vars.VIDEO_PRIVACY_STATUS || 'public' }}
          VIDEO_CATEGORY_ID: ${{ vars.VIDEO_CATEGORY_ID || '24' }}
          VIDEO_LANGUAGE: ${{ vars.VIDEO_LANGUAGE || 'en' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from trendforge.config import Settings
          from trendforge.publisher import upload_short

          settings = Settings.from_env()
          manifest_path = Path("outputs/series/series-manifest.json")
          manifest = json.loads(manifest_path.read_text())
          source = manifest["source"]

          for part in manifest["parts"]:
              p = Path(part["path"])
              script = {
                  "title": f"{source['title']} | Part {part['part']}/{part['total']}"[:90],
                  "description": (
                      f"{source['title']} — Part {part['part']} of {part['total']} from {source['creator']}.\n\n"
                      f"Source video: {source['url']}\n\n"
                      "Original footage clipped into vertical Shorts with attribution."
                  )[:4800],
                  "tags": ["shorts", "highlight", "clip", source["creator"][:40]],
                  "source": {
                      "url": source["url"],
                      "creator": source["creator"],
                      "title": source["title"],
                  },
              }
              result = upload_short(settings, p, script, publish=True)
              print(f"Part {part['part']}: {result['url']} ({result['privacy_status']})")
          PY

      - name: Upload series parts and manifest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-series-parts-${{ github.run_number }}
          path: |
            outputs/series/part-*.mp4
            outputs/series/series-manifest.json
          if-no-files-found: ignore
          retention-days: 7
